# kitty configuration. Reference: https://sw.kovidgoyal.net/kitty/conf/
# Reload: ctrl+shift+F5, or `kill -SIGUSR1 <pid>` (used by `theme`).

# Fallback colours (Rosé Pine); colors.conf below overrides them.
foreground #e0def4
background #191724

include colors.conf

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window
window_padding_width     10
hide_window_decorations  yes
confirm_os_window_close  0
window_border_width      1px
draw_minimal_borders     yes
remember_window_size     no
initial_window_width     100c
initial_window_height    30c

# Cursor
cursor_shape          block
cursor_blink_interval 0

# Behaviour
scrollback_lines      10000
enable_audio_bell     no
mouse_hide_wait       3.0
copy_on_select        no
update_check_interval 0

# Tab bar: only shown with 2+ tabs, plain text, no powerline shapes.
tab_bar_edge          bottom
tab_bar_style         separator
tab_separator         "  "
tab_bar_min_tabs      2
tab_title_template    " {index}: {title} "
active_tab_font_style bold
inactive_tab_font_style normal
