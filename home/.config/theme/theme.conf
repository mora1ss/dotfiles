# Theme settings. Sourced by ~/.local/bin/theme (bash syntax).

# Menu order and theme ids. Each static id needs a themes/<id>/ folder;
# "matugen" is generated from the wallpaper instead.
THEME_IDS=(matugen rose-pine gruvbox)

declare -A THEME_LABEL=(
    [matugen]="Matugen"
    [rose-pine]="Rosé Pine"
    [gruvbox]="Gruvbox"
)

declare -A THEME_WALLDIR=(
    [matugen]="$HOME/Pictures/Wallpapers/matugen"
    [rose-pine]="$HOME/Pictures/Wallpapers/rose-pine"
    [gruvbox]="$HOME/Pictures/Wallpapers/gruvbox"
)

# Used when no state exists yet (first run).
DEFAULT_THEME=rose-pine

# Wallpaper transition (see: awww img --help).
AWWW_ARGS=(--transition-type fade --transition-duration 0.4 --transition-fps 165)

# matugen scheme (see: matugen image --help). --source-color-index avoids
# matugen's interactive colour prompt.
MATUGEN_ARGS=(--mode dark --type scheme-tonal-spot --source-color-index 0 --quiet)
