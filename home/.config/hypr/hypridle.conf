# hypridle 0.1.8 — https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Timeouts are in seconds. Edit and restart hypridle (or log out) to apply.
#
# This machine has no /sys/class/backlight device and brightnessctl is not
# installed, so there is no dim-the-panel step.
# The waybar coffee icon (keep-awake) holds a systemd --what=idle inhibitor.
# hypridle honours that by default (ignore_systemd_inhibit is false), so every
# listener below pauses while it is on. Manual lock still works.
# The sequence is:
#   5 min   lock
#   5.5 min screen off
#   30 min  suspend (commented out — uncomment the last listener to enable)

general {
    # dbus lock event (SUPER + Escape, loginctl lock-session, lid, …)
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before sleep, and wait until the lock screen is actually up
    # (inhibit_sleep = 3) so the unlocked desktop is never visible on resume.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep    = 3
}

# --- 5 min: lock -----------------------------------------------------------
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# --- 5.5 min: turn the outputs off -----------------------------------------
# action names verified against Hyprland 0.56 (wiki: enable/disable).
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# --- 30 min: suspend (optional) --------------------------------------------
# Uncomment to suspend after half an hour of idle. The lock listener above
# will have already locked the session; inhibit_sleep waits for hyprlock.
# listener {
#     timeout    = 1800
#     on-timeout = systemctl suspend
# }
