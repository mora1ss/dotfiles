# hyprlock 0.9.6 — https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Colours come from hyprlock-colors.conf (rewritten by `theme`).
# If that file is missing hyprlock will refuse to start; keep a copy in place.

source = ~/.config/hypr/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor         = true
    ignore_empty_input  = true
    fail_timeout        = 2000
}

# Speed is in deciseconds: 1.5 = 150ms.
animations {
    enabled = true
    bezier = out, 0.16, 1, 0.3, 1
    animation = fade, 1, 1.5, out
    animation = inputField, 1, 1.5, out
}

background {
    monitor =
    path = screenshot
    color = $background
    blur_passes = 2
    blur_size   = 4
}

# Clock
label {
    monitor =
    text        = $TIME
    color       = $on_surface
    font_size   = 96
    font_family = $font
    position    = 0, 80
    halign      = center
    valign      = center
}

# Date
label {
    monitor =
    text        = cmd[update:60000] date +"%A, %d %B %Y"
    color       = $on_surface_variant
    font_size   = 16
    font_family = $font
    position    = 0, -20
    halign      = center
    valign      = center
}

input-field {
    monitor =
    size              = 280, 40
    outline_thickness = 1
    rounding          = 4
    inner_color       = $surface
    outer_color       = $outline
    font_color        = $on_surface
    font_family       = $font
    check_color       = $primary
    fail_color        = $error
    fade_on_empty     = false
    placeholder_text  = <i>password</i>
    fail_text         = <i>$FAIL</i>
    dots_size         = 0.25
    dots_spacing      = 0.35
    position          = 0, -110
    halign            = center
    valign            = center
}
